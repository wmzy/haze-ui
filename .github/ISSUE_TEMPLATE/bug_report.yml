name: 🐛 Bug report
description: Something in haze-ui is broken or behaves incorrectly
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report! Before opening, please check:

        - the [existing issues](https://github.com/wmzy/haze-ui/issues?q=is%3Aissue)
          for duplicates,
        - the [docs site](https://wmzy.github.io/haze-ui/) — especially
          [Getting started](https://wmzy.github.io/haze-ui/getting-started),
          since **components render unstyled when no stylesheet is loaded**
          (the JS entry imports no CSS by design).

        Environment notes: haze-ui is ESM-only, targets React 19 (`ref` as a
        prop, no React 18 compatibility layer), and requires Chrome/Edge 119+,
        Safari 16.4+ or Firefox 128+ (OKLCH relative colors, no fallbacks).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Minimal steps or code to reproduce the behavior. A link to a
        StackBlitz / CodeSandbox / repo is ideal.
      placeholder: |
        1. Render `<Component foo="bar" />`
        2. Click the trigger
        3. See error
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: input
    id: haze-version
    attributes:
      label: haze-ui version
      placeholder: 'e.g. 1.14.0'
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: 'e.g. 19.1.0'
    validations:
      required: true
  - type: dropdown
    id: css-mode
    attributes:
      label: CSS loading mode
      options:
        - Full stylesheet (`haze-ui/styles.css`)
        - Per-component subpaths (`haze-ui/css/*.css`)
        - Vite plugin (`haze-ui-vite`)
        - Not sure / none
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: 'e.g. Chrome 142, macOS 15'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Any warnings or errors from the browser console (optional).
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and the docs site first.
          required: true
