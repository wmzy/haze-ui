name: CI

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: npm run size
      # Packaging/type-resolution gates: publint checks the exports map
      # against actually packed files (caught the dead design-tokens/*/*
      # pattern once already); arethetypeswrong verifies every entrypoint's
      # .d.ts resolves under Node ESM + bundler — node10 is dead config for
      # an ESM-only package, hence --profile esm-only. The real CLI package
      # is @arethetypeswrong/cli: the unscoped "attw" name on npm is a
      # dependency-confusion placeholder, never install it.
      - run: npx -y publint
      - run: npx -y @arethetypeswrong/cli --pack . --profile esm-only --exclude-entrypoints './styles.css'
      # ./styles.css is a bundler side-effect subpath with no types by
      # design (the JS entry imports no stylesheet); node10 rows render as
      # "(ignored) 💀" but do not fail — node10 cannot read exports maps.
      # Read-only dist health check: top modules by size, appended to the
      # job summary (no extra tooling — find/sort/numfmt only, nothing is
      # installed and the build config is untouched; complements
      # size-limit's per-budget gates with the full module picture).
      - name: Dist size report (job summary)
        run: |
          total=$(du -sb dist | cut -f1)
          {
            echo '## dist size report — top 30 modules'
            echo ''
            echo '| bytes | size | file |'
            echo '| ---: | ---: | --- |'
            find dist -type f -printf '%s\t%p\n' \
              | sort -rn | head -30 \
              | while IFS=$'\t' read -r size file; do
                printf '| %s | %s | `%s` |\n' "$size" "$(numfmt --to=iec --suffix=B "$size")" "$file"
              done
            echo ''
            echo "- **files:** $(find dist -type f | wc -l)"
            echo "- **total:** ${total} bytes ($(numfmt --to=iec --suffix=B "$total"))"
          } >> "$GITHUB_STEP_SUMMARY"

  # Real-browser smoke tests + pixel baselines against the vite harness in
  # e2e/app (not the built demo). Snapshots are only reproducible on the
  # same Playwright-pinned Chromium as the baselines were captured with,
  # so install the browser from the lockfile-pinned @playwright/test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  # Real VoiceOver screen reader smoke (macOS only, via guidepup): the
  # AT layer axe cannot see — that dialogs, menus, and toasts are
  # actually *announced* by a real screen reader, not just statically
  # conformant. Runs headed on a macos runner (screen readers cannot
  # drive headless browsers; macOS needs no xvfb) with VoiceOver
  # automation prepared by @guidepup/setup. On every other platform —
  # including the Linux e2e job above, which collects the same spec as
  # part of the full suite — the file skips cleanly.
  # Local reproduction (macOS only):
  #   1. grant your terminal/IDE Accessibility permission
  #      (System Settings → Privacy & Security → Accessibility)
  #   2. npx @guidepup/setup setup && npx @guidepup/setup install
  #   3. pnpm exec playwright test screen-reader --config e2e/playwright.config.ts
  # Announcement capture notes (calibrated on the CI runner, run
  # 37173802176 green): the spec drives VoiceOver through its own
  # command channel (act/next/press) — CDP-dispatched clicks and
  # keystrokes never reached the spoken-phrase log in the CI VM —
  # and guidepup's voiceOverStartOptions must be { capture: true },
  # since the default "initial" records only the first page of
  # output. The dialog/toast assertions check the AT-layer
  # exposure (cursor lands → name/message announced): this VM's
  # Chromium does not route automatic dialog-open or live-region
  # announcements to VoiceOver. Failure artifacts (trace.zip /
  # error-context.md) are uploaded so the macOS environment is
  # diagnosable remotely.
  screen-reader:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Prepare VoiceOver automation
        run: npx -y @guidepup/setup setup --ci
      - name: Install guidepup screen reader assets
        run: npx -y @guidepup/setup install
      - run: npx playwright install chromium
      - run: PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1 pnpm exec playwright test screen-reader --config e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screen-reader-results
          path: e2e/test-results
          retention-days: 14

  # Real NVDA screen reader smoke (Windows only, via guidepup): the
  # Windows half of the AT matrix the macOS VoiceOver job above
  # covers — same announcement contracts (dialog accessible name,
  # focused menu item, polite toast), driven through NVDA's own
  # command channel (act/next/press) rather than CDP dispatches, per
  # guidepup's official playwright-nvda workflow. Runs headed on a
  # windows runner (screen readers cannot drive headless browsers;
  # Windows needs no xvfb). Environment prep mirrors the macOS job's
  # two-step: `@guidepup/setup setup --ci` then `install` — on
  # Windows the install step downloads the NVDA assets
  # (guidepup.gg/docs CI guide). On every other platform — including
  # the Linux e2e job, which collects the spec as part of the full
  # suite, and the macOS VoiceOver job above, whose `screen-reader`
  # filter also matches the file — the spec skips cleanly.
  # Local reproduction (Windows only):
  #   1. npx @guidepup/setup setup && npx @guidepup/setup install
  #   2. pnpm exec playwright test screen-reader-nvda --config e2e/playwright.config.ts
  # Env note: PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS is set via
  # the step's env map because pwsh (the default Windows shell) does
  # not support the inline `VAR=1 cmd` prefix the macOS job uses.
  # First-run risk: this job's first green run is the spec's first
  # real execution — announcement phrasing may need calibration
  # there (failure artifacts are uploaded for remote diagnosis).
  screen-reader-nvda:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Prepare NVDA automation
        run: npx -y @guidepup/setup setup --ci
      - name: Install guidepup screen reader assets
        run: npx -y @guidepup/setup install
      - run: npx playwright install chromium
      - run: pnpm exec playwright test screen-reader-nvda --config e2e/playwright.config.ts
        env:
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screen-reader-nvda-results
          path: e2e/test-results
          retention-days: 14

  # Unit-test coverage gate (v8 provider; 70% thresholds configured in
  # vite.config.mts). A separate job so it never adds time to the
  # build/e2e critical path — it re-runs the same unit suite as the
  # build job but instrumented, and uploads the lcov/text reports for
  # local inspection (14-day retention: coverage is per-HEAD
  # diagnostics, not a long-lived artifact).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 14
