  <body>
    <div id="root"></div>
    <script>
      // StackBlitz WebContainer（demo 页内运行）要求宿主页跨域隔离。
      // dev server 由 vite.config.mts 的 server.headers 提供 COOP/COEP；
      // 生产 gh-pages 无法设置响应头，由 coi-serviceworker 在 SW 响应上补齐
      // （检测到页面已隔离时自动跳过注册）。强制 coepCredentialless：
      // 默认启发式在 Chromium 下会退到 require-corp，拦掉 demo 中的跨域
      // 图片；credentialless 让无凭据的跨域图片照常加载。
      window.coi = { coepCredentialless: () => true, quiet: true };
    </script>
    <script src="/haze-ui/v/v1.33.0/coi-serviceworker.js"></script>
  </body>
